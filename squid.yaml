manifestVersion: subsquid.io/v0.1
name: internal-squid
version: 9
description: "Internal Squid"
build:
deploy:
  env:
    RPC_BERACHAIN_HTTP: ${{ secrets.RPC_BERACHAIN_HTTP }}
  addons:
    postgres:
    # rpc:
    #   - eth.http
  processor:
    cmd: ["sqd", "process:prod"]
  api:
    cmd: ["sqd", "serve:prod"]
scale:
  dedicated: true
  addons:
    postgres:
      profile: medium
